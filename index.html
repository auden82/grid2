<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GRID2</title>

  <link rel="icon" type="image/png" href="favicon.png?v=2">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Banner: original image 2024 × 777 */
    .banner-wrapper {
      width: 60%;
      margin: 0 auto;
      overflow: hidden;

      /* Desktop: bottom 20% cropped */
      aspect-ratio: 2024 / 621.6;
    }

    .banner {
      display: block;
      width: 100%;
      height: auto;
    }

    .home-content {
      width: 90%;
      max-width: 800px;
      margin: 35px auto 80px;
      text-align: center;
    }

    .home-content h1 {
      margin: 0 0 18px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 3px;
      line-height: 1.3;
    }

    .home-content p {
      margin: 0 0 28px;
      color: #aaa;
      font-size: 16px;
      line-height: 1.7;
    }

    .pricing-link {
      display: inline-block;
      padding: 12px 22px;
      color: #fff;
      text-decoration: none;
      border: 1px solid #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .pricing-link:hover {
      background: #fff;
      color: #000;
    }

    @media (max-width: 600px) {

      /* Mobile:
         crop 20% left/right
         crop 20% top/bottom */
      .banner-wrapper {
        width: 100%;
        aspect-ratio: 1214.4 / 466.2;
      }

      .banner {
        width: 166.6667%;
        max-width: none;
        margin-left: -33.33335%;
        transform: translateY(-20%);
      }

      .home-content {
        margin-top: 28px;
        padding: 0 16px;
      }

      .home-content h1 {
        font-size: 22px;
        letter-spacing: 2px;
      }

      .home-content p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="banner-wrapper">
    <img
      class="banner"
      src="grid2.png"
      alt="GRID2"
    >
  </div>

  <main class="home-content">

    <h1>MARKETING SHOULDN'T NEED A QUOTE.</h1>

    <p>
      Strategy. Creative. Digital.<br>
      Transparent fixed pricing.
    </p>

    <a class="pricing-link" href="pricing.html">
      VIEW PRICING
    </a>

  </main>

</body>
</html>
