<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GRID2</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
    }

    /* Banner container */
    .banner-wrapper {
      width: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Desktop banner */
    .banner {
      width: 60%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Form */
    .form-wrapper {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .signup-form {
      display: block;
      width: 100%;
      max-width: 540px;
      height: 650px;
      margin: 0 auto;
      padding: 0;
      border: 0;
    }

    /* Mobile */
    @media (max-width: 600px) {

      .banner-wrapper {
        width: 100%;
        overflow: hidden;
      }

      .banner {
        width: 166.67%;
        max-width: none;
        height: auto;

        /* Centre the image so both sides are cropped */
        margin-left: -33.335%;
        margin-right: 0;
      }

      .signup-form {
        width: 100%;
        height: 750px;
      }
    }
  </style>
</head>

<body>

  <div class="banner-wrapper">
    <img
      class="banner"
      src="grid2home.png"
      alt="GRID2"
    >
  </div>

  <div class="form-wrapper">
    <iframe
      class="signup-form"

      scrolling="no"

</body>
</html>
