<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GRID2</title>

  <link rel="icon" type="image/png" href="favicon.png?v=2">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       BANNER
       Original image: 2024 × 777
       ========================= */

    .banner-wrapper {
      width: 60%;
      margin: 0 auto;
      padding: 0;
      overflow: hidden;

      /* Desktop:
         show top 80% of image,
         cropping bottom 20% */
      aspect-ratio: 2024 / 621.6;
    }

    .banner {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    /* =========================
       PRICING LINK
       ========================= */

    .pricing-link {
      display: block;
      width: fit-content;
      margin: 20px auto;
      padding: 10px 20px;

      color: #fff;
      text-decoration: none;

      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .pricing-link:hover {
      text-decoration: underline;
    }

    /* =========================
       FORM
       ========================= */

    .form-wrapper {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .signup-form {
      display: block;
      width: 100%;
      max-width: 540px;
      height: 650px;

      margin: 0 auto;
      padding: 0;
      border: 0;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .banner-wrapper {
        width: 100%;
        overflow: hidden;

        /*
          Show central 60% vertically.
          Original:
          2024 × 777

          Central crop:
          1214.4 × 466.2
        */
        aspect-ratio: 1214.4 / 466.2;
      }

      .banner {
        /*
          Enlarge to show central
          60% of original width.
        */
        width: 166.6667%;
        max-width: none;
        height: auto;

        /*
          Centre horizontally,
          cropping left + right.
        */
        margin-left: -33.33335%;

        /*
          Crop top 20%.
        */
        transform: translateY(-20%);
      }

      .pricing-link {
        margin: 16px auto;
        font-size: 15px;
      }

      .signup-form {
        width: 100%;
        height: 750px;
      }
    }

  </style>
</head>

<body>

  <!-- GRID2 Banner -->
  <div class="banner-wrapper">
    <img
      class="banner"
      src="grid2.png"
      alt="GRID2"
    >
  </div>

  <!-- Pricing -->
  <a
    class="pricing-link"
    href="pricing.html"
  >
    VIEW PRICING
  </a>

  <!-- Brevo Signup Form -->
  <div class="form-wrapper">

    <iframe
      class="signup-form"
      src="https://0ae01892.sibforms.com/v2/serve/MUIFAC2kmGAaZedvOkD_DE6kt-66hA_w9ISauju7oN-yyLEl3_G_0S_eZZCLqJwks7ntVn_MA8v1CBPFnqGnouHObSW_eMDyE8Cj-xE8Osh-uaq2PlmDZ5ZcDMrk5z3SUAgvlVfuDKI1KOxqCC5FK9g0_kFzbI34GDL-ewqXjEBf6_rj_OcAQ4GfMEqzukdo6umfmYPeDNBvHYolBA=="
      scrolling="no"
      allowfullscreen>
    </iframe>

  </div>

</body>
</html>
